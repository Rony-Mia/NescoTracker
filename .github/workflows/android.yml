name: Android CI/CD

on:
  push:
    tags:
      - 'v*' 

permissions:
  contents: write # রিলিজ তৈরি করার জন্য এই পারমিশন জরুরি

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/*.apk # এই ফোল্ডারের সব APK ফাইল রিলিজ করবে
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
